<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datepicker — демо стенд компонента</title>
<!--
  Демо стенд КОМПОНЕНТА Datepicker (семейство). Папка: DS/components-web/components/Datepicker_DS/.
  Табы — компонент ДС Tabs (Tabs_DS/tabs.css: ds-tabs / ds-tab / ds-tab--active); переключение панелей — скрипт стенда.
  Порядок табов — как в Фигме (слева направо), первым — сборка: 1) Basic example (живое поле + раскрывашка),
  2) Input Datepicker (Empty / Populated — узел 58548-4764), 3) Elements Datepicker (ячейки — узел 58501-4220),
  4) Control Panel Datepicker (Control / Week / Calendar — узел 58501-4052), 5) Datepicker (Day / Year / Month — узел 58509-5439),
  6) Поведение — спека примеров (узел 58987-16573): разделы «Дефолтный выбор даты», «Выбор диапазона дат»
  и «Выбор месяца и года в календаре» — пошаговые состояния поля (Default → Hover → Focus → Focus+Value → Selected)
  и календари в выпадающем слое (классы .dpb-* в <style> стенда; новые режимы mountInput: state / text / caret,
  вид года — opts.decade с заголовком «2020 - 2039»).
  Табы 2–5 — статичные витрины вариантов, как в Figma (интерактив — только в «Сборке»);
  ВКЛАДКА «ПОВЕДЕНИЕ» ЖИВАЯ: поля — настоящие ds-input-datepicker (ввод работает, иконка открывает
  календарь-дропдаун), календари — интерактивные (клик по дню/году/месяцу, стрелки и пилюля переключают вид);
  состояния Hover/Press/Focus показаны «замороженно» (классы st-hover/st-press/dpb--* — те же токены, что у :hover/:active/:focus).
  Вид — сгенерированный слой ДС + ручной слой ../../fixes.css; разметку и поведение строит datepicker.js.
  Данные — актуальные: текущий месяц и сегодняшняя дата.
-->
<link rel="stylesheet" href="../../font.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../index.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<link rel="stylesheet" href="../../fixes.css">
<script src="datepicker.js" defer></script>
<style>
  /* каркас демо-стенда — как у других стендов (ср. organisms/app-header/demo.html) */
  html, body { margin: 0; background: #fff; font-family: var(--ds-font-family, Roboto, sans-serif); color: var(--ds-color-text-primary); }
  .demo-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--ds-color-stroke-default, #e0e0e0); font-size: 13px; }
  .demo-bar__title { font-weight: 500; margin-right: 8px; }
  .demo-bar__state { margin-left: 12px; color: var(--ds-color-text-secondary, #616161); font-variant-numeric: tabular-nums; }
  .view { padding: 24px; }
  .view .ds-tabs { margin-bottom: 24px; }
  .panel { width: fit-content; max-width: 1160px; box-sizing: border-box; padding: 32px; border: 1px solid var(--ds-color-stroke-default, #e0e0e0); background: #fff; }
  /* обвязка примеров на стенде (не ДС) */
  .cards { display: flex; gap: 32px; align-items: flex-start; }
  /* зазоры витрин — из координат Figma */
  .fields.fields--input { gap: 61px; }                               /* Input Datepicker: y 178 → 287 (48 + 61) */
  .rows.rows--panel { gap: 0; }                                    /* Control Panel: Control → Week 24; Week → Calendar 28 */
  .rows--panel > :nth-child(2) { margin-top: 24px; }
  .rows--panel > :nth-child(3) { margin-top: 28px; }
  .cards.cards--datepicker { gap: 46px; width: 100%; max-width: 100%; overflow-x: auto; padding-bottom: 8px; }   /* Day / Year / Month: x 67 → 425 → 783 (312 + 46); ряд скроллится, страница не разъезжается */
  .panel { min-width: 0; width: 100%; box-sizing: border-box; }   /* иначе flex-колонка .view растягивается под широкие витрины */
  .card__cap { font-size: 12px; line-height: 16px; color: var(--ds-color-text-secondary, #616161); margin-bottom: 8px; }
  .fields { display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
  .rows { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row__cap { width: 220px; flex: none; font-size: 12px; line-height: 16px; color: var(--ds-color-text-secondary, #616161); }
  .demo-w280 { width: 280px; }
  /* витрина Elements — раскладка как в наборе Figma: колонки вариантов × строки состояний */
  .el-band { display: flex; align-items: flex-start; }
  .el-col { display: flex; flex-direction: column; align-items: center; gap: 0; }
  /* зазоры рядов — из координат Figma (58501:4220): Default 24/24/24; Today и Range 22/22/30; Selected 22/22 */
  .el-band--cells .el-col > :nth-child(n+2) { margin-top: 22px; }
  .el-band--cells .el-col:nth-child(1) > :nth-child(n+2) { margin-top: 24px; }
  .el-band--cells .el-col:nth-child(2) > :nth-child(4),
  .el-band--cells .el-col:nth-child(4) > :nth-child(4) { margin-top: 30px; }
  /* Year: 14/22/22; Month: 22/22/14 (как в наборе) */
  .el-band--lower .el-col > :nth-child(n+2) { margin-top: 22px; }
  .el-band--lower .el-col:nth-child(-n+3) > :nth-child(2) { margin-top: 14px; }
  .el-band--lower .el-col:nth-child(4) > :nth-child(4) { margin-top: 14px; }
  .el-band--cells > .el-col { margin-right: 60px; }
  .el-band--cells > .el-col:nth-child(2) { margin-right: 64px; }
  .el-band--cells > .el-col:nth-child(3) { margin-right: 105px; }
  .el-band--cells > .el-col:last-child { margin-right: 0; }
  .el-band--lower { margin-top: 68px; }
  /* колонки нижней полосы — из координат: 52→145→240→388 при ширине 70 (зазоры 23 / 25 / 78) */
  .el-band--lower .el-col { margin-right: 23px; }
  .el-band--lower .el-col:nth-child(2) { margin-right: 25px; }
  .el-band--lower .el-col:nth-child(3) { margin-right: 78px; }
  .el-band--lower .el-col.el-col--month { margin-left: 0; margin-right: 0; }
  /* стенд: «замороженные» состояния Hover/Press для витрин (в ДС это :hover/:active — те же токены) */
  .st-hover.ds-elements--cell.ds-elements--default, .st-hover .ds-elements--cell.ds-elements--default,
  .st-hover.ds-elements--cell.ds-elements--today, .st-hover .ds-elements--cell.ds-elements--today { background: var(--ds-color-elements-datepicker-cell-default-hover-background, #f5f5f5); }
  .st-press.ds-elements--cell.ds-elements--default, .st-press .ds-elements--cell.ds-elements--default,
  .st-press.ds-elements--cell.ds-elements--today, .st-press .ds-elements--cell.ds-elements--today { background: var(--ds-color-elements-datepicker-cell-default-press-background, #e0e0e0); }
  .st-hover.ds-elements--cell.ds-elements--selected, .st-hover .ds-elements--cell.ds-elements--selected { background: var(--ds-color-elements-datepicker-cell-selected-hover-background, #3969d5); }
  .st-press.ds-elements--cell.ds-elements--selected, .st-press .ds-elements--cell.ds-elements--selected { background: var(--ds-color-elements-datepicker-cell-selected-press-background, #2651b5); }
  /* у range наведения-слоя нет; в press — серый кружок на ячейке поверх подсветки (как в Figma) */
  .st-hover.ds-elements__range-highlight-middle .ds-elements--cell,
  .st-hover .ds-elements__range-highlight-middle .ds-elements--cell { background: transparent; }
  .st-hover.ds-elements--year.ds-elements--default, .st-hover .ds-elements--year.ds-elements--default,
  .st-hover.ds-elements--year.ds-elements--today, .st-hover .ds-elements--year.ds-elements--today { background: var(--ds-color-elements-datepicker-year-default-hover-background, #f5f5f5); }
  .st-press.ds-elements--year.ds-elements--default, .st-press .ds-elements--year.ds-elements--default,
  .st-press.ds-elements--year.ds-elements--today, .st-press .ds-elements--year.ds-elements--today { background: var(--ds-color-elements-datepicker-year-default-press-background, #e0e0e0); }
  .st-hover.ds-elements--year.ds-elements--selected, .st-hover .ds-elements--year.ds-elements--selected { background: var(--ds-color-elements-datepicker-year-selected-hover-background, #3969d5); }
  .st-press.ds-elements--year.ds-elements--selected, .st-press .ds-elements--year.ds-elements--selected { background: var(--ds-color-elements-datepicker-year-selected-press-background, #2651b5); }
  .st-hover.ds-elements--month.ds-elements--default, .st-hover .ds-elements--month.ds-elements--default { background: var(--ds-color-elements-datepicker-month-default-hover-background, #f5f5f5); }
  .st-press.ds-elements--month.ds-elements--default, .st-press .ds-elements--month.ds-elements--default { background: var(--ds-color-elements-datepicker-month-default-press-background, #e0e0e0); }
  .material-icons { font-family: 'Material Icons Outlined'; }   /* иконки — только аутлайн (правило) */
  /* ── вкладка «Поведение» (спека Examples 58987-16573) ───────────────────── */
  .dpb { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; padding-bottom: 8px; }
  /* панель «Поведение» — широкая спека: скроллим внутри, страница не разъезжается */
  .panel[data-vpanel="behavior"] { width: 100%; min-width: 0; max-width: 100%; overflow-x: hidden; }
  .panel[data-vpanel="behavior"] .dpb-sec,
  .panel[data-vpanel="behavior"] .dpb-block { width: max-content; max-width: none; }
  .dpb-sec { margin-bottom: 64px; }
  .dpb-sec__title { width: max-content; margin: 0 0 8px;
    font-size: var(--ds-font-header-l-34-normal-medium-size, 34px);
    line-height: var(--ds-font-header-l-34-normal-medium-line, 40px);
    letter-spacing: var(--ds-font-header-l-34-normal-medium-spacing, 0px);
    font-weight: var(--ds-font-header-l-34-normal-medium-weight, 500);
    color: var(--ds-color-text-primary, #333333); }
  .dpb-sec__body { width: 944px; margin: 0 0 32px;
    font-size: var(--ds-font-body-s-14-normal-regular-size, 14px);
    line-height: var(--ds-font-body-s-14-normal-regular-line, 20px);
    letter-spacing: var(--ds-font-body-s-14-normal-regular-spacing, .5px);
    font-weight: var(--ds-font-body-s-14-normal-regular-weight, 400);
    color: var(--ds-color-text-secondary, #616161); }
  .dpb-block { margin-bottom: 40px; }
  .dpb-block__title { width: max-content; margin: 0 0 8px;
    font-size: var(--ds-font-body-l-18-normal-medium-size, 18px);
    line-height: var(--ds-font-body-l-18-normal-medium-line, 24px);
    letter-spacing: var(--ds-font-body-l-18-normal-medium-spacing, .5px);
    font-weight: var(--ds-font-body-l-18-normal-medium-weight, 500);
    color: var(--ds-color-text-primary, #333333); }
  .dpb-note { width: max-content; max-width: 900px; margin: 0 0 16px;
    font-size: var(--ds-font-caption-l-12-normal-regular-size, 12px);
    line-height: var(--ds-font-caption-l-12-normal-regular-line, 16px);
    letter-spacing: var(--ds-font-caption-l-12-normal-regular-spacing, .5px);
    font-weight: var(--ds-font-caption-l-12-normal-regular-weight, 400);
    color: var(--ds-color-text-secondary, #616161); }
  .dpb-row { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 24px 32px; margin-bottom: 24px; width: max-content; }
  .dpb-step { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .dpb-cap { width: max-content; font-size: var(--ds-font-body-s-14-normal-regular-size, 14px); line-height: var(--ds-font-body-s-14-normal-regular-line, 20px); letter-spacing: var(--ds-font-body-s-14-normal-regular-spacing, .5px); font-weight: var(--ds-font-body-s-14-normal-regular-weight, 400); color: var(--ds-color-text-secondary, #616161); }
  .dpb-arrow { align-self: flex-start; margin-top: 24px; font-size: var(--ds-font-body-s-14-normal-regular-size, 14px); line-height: var(--ds-font-body-s-14-normal-regular-line, 20px); letter-spacing: var(--ds-font-body-s-14-normal-regular-spacing, .5px); color: var(--ds-color-text-tertiary, #9e9e9e); }
  .dpb-field { width: 250px; }
  .dpb-field .ds-input-datepicker { width: 250px; }
  /* замороженные состояния поля (те же токены, что у :hover/:focus) */
  .dpb--hover .ds-input__frame { background: var(--ds-color-form-field-filled-hover-background, #f5f5f5); }
  .dpb--focus .ds-input__frame { border-color: var(--ds-color-stroke-accent, #448aff); }
  .dpb--focus .ds-input__label { color: var(--ds-color-text-accent, #448aff); }
  .dpb--focus .ds-input__icon { color: var(--ds-color-icon-accent, #448aff); }
  /* статичный текст вместо input (витрина состояний) */
  .ds-input-datepicker__text { display: block; white-space: nowrap; overflow: hidden; color: var(--ds-color-text-placeholder, #d6d6d6); }
  .dpb--focus .ds-input-datepicker__text { color: var(--ds-color-text-tertiary, #9e9e9e); }
  .dpb--selected .ds-input-datepicker__text { color: var(--ds-color-text-primary, #333333); }
  .ds-input-datepicker__caret { display: inline-block; width: 1px; height: 20px; margin: 0 1px; vertical-align: -4px; background: var(--ds-color-text-primary, #333333); }
  /* календарь в выпадающем слое */
  .dpb-cal { width: 312px; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 6px rgba(33,33,33,.10), 0 0 16px rgba(33,33,33,.12); }
  .dpb-cal .ds-datepicker { border-color: transparent; }
  .dpb-hover-cell { background: var(--ds-color-brand-neutral-super-light, #f5f5f5) !important; }
</style>
</head>
<body>
<div class="demo-bar">
  <span class="demo-bar__title">Демо стенд Datepicker</span>
  <span class="demo-bar__state" id="state">Выбрано: —</span>
</div>
<div class="view">
  <!-- табы — компонент ДС Tabs; переключение панелей — скрипт внизу страницы -->
  <div class="ds-tabs" role="tablist" aria-label="Компоненты семейства Datepicker">
    <button class="ds-tab ds-tab--active" role="tab" data-vtab="assembly" aria-selected="true">Basic example</button>
    <button class="ds-tab" role="tab" data-vtab="input" aria-selected="false">Input Datepicker</button>
    <button class="ds-tab" role="tab" data-vtab="elements" aria-selected="false">Elements Datepicker</button>
    <button class="ds-tab" role="tab" data-vtab="panel" aria-selected="false">Control Panel Datepicker</button>
    <button class="ds-tab" role="tab" data-vtab="datepicker" aria-selected="false">Datepicker</button>
    <button class="ds-tab" role="tab" data-vtab="behavior" aria-selected="false">Поведение</button>
  </div>

  <!-- 1. Basic example: живое поле + раскрывашка (как пример «Focus» — «По меню календарь» в Figma) -->
  <div class="panel" data-vpanel="assembly" role="tabpanel">
    <div class="fields">
      <div id="asm-example"></div>
    </div>
  </div>

  <!-- 2. Input Datepicker: Empty / Populated (узел 58548-4764) — статичные витрины вариантов (без выпадашки) -->
  <div class="panel" data-vpanel="input" role="tabpanel" hidden>
    <div class="fields fields--input">
      <div id="inp-empty"></div>
      <div id="inp-populated"></div>
    </div>
  </div>

  <!-- 3. Elements Datepicker: ячейки — день / месяц / год (узел 58501-4220; колонки — варианты, строки — состояния, как в наборе Figma) -->
  <div class="panel" data-vpanel="elements" role="tabpanel" hidden>
    <div class="el-band el-band--cells">
      <div class="el-col">
        <span class="ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span>
        <span class="st-hover ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span>
        <span class="st-press ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span>
        <span class="ds-elements ds-elements--cell ds-elements--default ds-elements--disabled"><span class="ds-elements__label">00</span></span>
      </div>
      <div class="el-col">
        <span class="ds-elements ds-elements--cell ds-elements--today"><span class="ds-elements__label">00</span></span>
        <span class="st-hover ds-elements ds-elements--cell ds-elements--today"><span class="ds-elements__label">00</span></span>
        <span class="st-press ds-elements ds-elements--cell ds-elements--today"><span class="ds-elements__label">00</span></span>
        <span class="ds-elements ds-elements--cell ds-elements--today ds-elements--disabled"><span class="ds-elements__label">00</span></span>
      </div>
      <div class="el-col">
        <!-- выбранный вариант в наборе Figma — 3 состояния (disabled у Selected не нарисован) -->
        <span class="ds-elements ds-elements--cell ds-elements--selected"><span class="ds-elements__label">00</span></span>
        <span class="st-hover ds-elements ds-elements--cell ds-elements--selected"><span class="ds-elements__label">00</span></span>
        <span class="st-press ds-elements ds-elements--cell ds-elements--selected"><span class="ds-elements__label">00</span></span>
      </div>
      <div class="el-col">
        <span class="ds-elements__range-highlight-middle"><span class="ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span></span>
        <span class="st-hover ds-elements__range-highlight-middle"><span class="ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span></span>
        <span class="st-press ds-elements__range-highlight-middle"><span class="ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span></span>
        <span class="ds-elements__range-highlight-middle ds-elements--disabled"><span class="ds-elements ds-elements--cell ds-elements--default"><span class="ds-elements__label">00</span></span></span>
      </div>
    </div>
    <div class="el-band el-band--lower">
      <div class="el-col">
        <span class="ds-elements ds-elements--year ds-elements--default"><span class="ds-elements__label">2025</span></span>
        <span class="st-hover ds-elements ds-elements--year ds-elements--default"><span class="ds-elements__label">2025</span></span>
        <span class="st-press ds-elements ds-elements--year ds-elements--default"><span class="ds-elements__label">2025</span></span>
        <span class="ds-elements ds-elements--year ds-elements--default ds-elements--disabled"><span class="ds-elements__label">2025</span></span>
      </div>
      <div class="el-col">
        <span class="ds-elements ds-elements--year ds-elements--today"><span class="ds-elements__label">2025</span></span>
        <span class="st-hover ds-elements ds-elements--year ds-elements--today"><span class="ds-elements__label">2025</span></span>
        <span class="st-press ds-elements ds-elements--year ds-elements--today"><span class="ds-elements__label">2025</span></span>
        <span class="ds-elements ds-elements--year ds-elements--today ds-elements--disabled"><span class="ds-elements__label">2025</span></span>
      </div>
      <div class="el-col">
        <!-- выбранный год в наборе Figma — 3 состояния (disabled у Selected не нарисован) -->
        <span class="ds-elements ds-elements--year ds-elements--selected"><span class="ds-elements__label">2025</span></span>
        <span class="st-hover ds-elements ds-elements--year ds-elements--selected"><span class="ds-elements__label">2025</span></span>
        <span class="st-press ds-elements ds-elements--year ds-elements--selected"><span class="ds-elements__label">2025</span></span>
      </div>
      <div class="el-col el-col--month">
        <span class="ds-elements ds-elements--month ds-elements--default"><span class="ds-control-panel__label">Апрель</span><span class="ds-control-panel__icon"><span class="material-icons">arrow_drop_down</span></span></span>
        <span class="st-hover ds-elements ds-elements--month ds-elements--default"><span class="ds-control-panel__label">Апрель</span><span class="ds-control-panel__icon"><span class="material-icons">arrow_drop_down</span></span></span>
        <span class="st-press ds-elements ds-elements--month ds-elements--default"><span class="ds-control-panel__label">Апрель</span><span class="ds-control-panel__icon"><span class="material-icons">arrow_drop_down</span></span></span>
        <span class="ds-elements ds-elements--month ds-elements--default ds-elements--disabled"><span class="ds-control-panel__label">Апрель</span><span class="ds-control-panel__icon"><span class="material-icons">arrow_drop_down</span></span></span>
      </div>
    </div>
  </div>

  <!-- 4. Control Panel Datepicker: Control / Week / Calendar (узел 58501-4052) -->
  <div class="panel" data-vpanel="panel" role="tabpanel" hidden>
    <div class="rows rows--panel">
      <div>
        <div class="ds-control-panel ds-control-panel--control">
          <span class="ds-elements ds-elements--month ds-elements--default">
            <span class="ds-control-panel__label">Июнь 2026</span>
            <span class="ds-control-panel__icon"><span class="material-icons">arrow_drop_down</span></span>
          </span>
          <span class="ds-control-panel__button-icon-group">
            <span class="ds-control-panel__button-icon"><span class="material-icons">chevron_left</span></span>
            <span class="ds-control-panel__button-icon"><span class="material-icons">chevron_right</span></span>
          </span>
        </div>
      </div>
      <div>
        <div class="ds-control-panel ds-control-panel--week">
          <div class="ds-datepicker__elements">
            <span class="ds-datepicker__label">ПН</span>
            <span class="ds-datepicker__label">ВТ</span>
            <span class="ds-datepicker__label">СР</span>
            <span class="ds-datepicker__label">ЧТ</span>
            <span class="ds-datepicker__label">ПТ</span>
            <span class="ds-datepicker__label">СБ</span>
            <span class="ds-datepicker__label">ВС</span>
          </div>
        </div>
      </div>
      <div>
        <div class="ds-control-panel ds-control-panel--calendar">
          <div id="cp-calendar" class="demo-w280"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. Datepicker: три вида как в узле 58509-5439 (Day / Year / Month) — статичные витрины -->
  <div class="panel" data-vpanel="datepicker" role="tabpanel" hidden>
    <div class="cards cards--datepicker">
      <div id="cal-day"></div>
      <div id="cal-year"></div>
      <div id="cal-month"></div>
    </div>
  </div>

  <!-- 6. Поведение: спека кадра 58987-16573 (Examples) — состояния поля и календари -->
  <div class="panel" data-vpanel="behavior" role="tabpanel" hidden>
    <div class="dpb" id="dpb-root"></div>
  </div>
</div>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var today = new Date();   /* актуальные данные: текущий месяц и сегодня */
    var st = document.getElementById('state');
    function show(s, e) {
      st.textContent = 'Выбрано: ' + Datepicker.fmtFull(s) +
        (e && e.getTime() !== s.getTime() ? ' - ' + Datepicker.fmtFull(e) : '');
    }

    /* 1. Basic example: одно живое поле, календарь открыт сразу (пример «Focus»), выбор даты работает */
    Datepicker.mountInput(document.getElementById('asm-example'), { open: true, onPick: show });

    /* 2. Input Datepicker: Empty / Populated — статичные поля (без выпадашки);
       по кадру 58548-4764: Empty — одна строка «ДД.ММ.ГГГГ» цветом label (#616161),
       Populated — подпись «Дата» 12/16 + «ДД.ММ.ГГГГ» 16/24 цветом плейсхолдера (#D6D6D6) */
    Datepicker.mountInput(document.getElementById('inp-empty'), { static: true, label: 'ДД.ММ.ГГГГ' });
    Datepicker.mountInput(document.getElementById('inp-populated'), { static: true, label: 'Дата', populated: true });

    /* 4. Control Panel: вариант «Calendar» — сетка дней (кадр Figma: июнь 2026, «сегодня» 03) */
    var tmpCal = document.createElement('div');
    tmpCal.style.display = 'none';
    document.body.appendChild(tmpCal);
    Datepicker.mount(tmpCal, { static: true, view: new Date(2026, 5, 1), today: new Date(2026, 5, 3) });
    document.getElementById('cp-calendar').appendChild(tmpCal.querySelector('.ds-datepicker__days'));
    tmpCal.remove();

    /* 5. Datepicker: три вида (Day / Year / Month) — статичные, как узлы Figma 58509-5439;
       данные кадра: июнь 2026, «сегодня» 03 (кольцо), выбранное 10 (синий кружок) */
    var dpView = new Date(2026, 5, 1), dpToday = new Date(2026, 5, 3), dpSel = new Date(2026, 5, 10);
    Datepicker.mount(document.getElementById('cal-day'), { static: true, view: dpView, today: dpToday, start: dpSel, end: dpSel });
    Datepicker.mount(document.getElementById('cal-year'), { static: true, mode: 'year', view: dpView, today: dpToday });
    Datepicker.mount(document.getElementById('cal-month'), { static: true, mode: 'month', view: dpView, today: dpToday });

    /* 6. Поведение — спека Examples (58987-16573): состояния поля и календари.
       Тексты и раскладка — по кадру; календарь в выпадающем слое — карточка 312. */
    (function buildBehavior() {
      var root = document.getElementById('dpb-root');
      if (!root) return;
      try {
      var JUNE = new Date(2026, 5, 1), TODAY = new Date(2026, 5, 3), SEL = new Date(2026, 5, 10);

      function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
      }

      function stepField(o) {
        var step = el('div', 'dpb-step');
        if (o.cap) step.appendChild(el('span', 'dpb-cap', o.cap));
        var w = el('div', 'dpb-field');
        step.appendChild(w);
        /* поле — ЖИВОЕ: ввод с клавиатуры работает, иконка открывает календарь;
           класс состояния (dpb--*) только замораживает вид. */
        var api = Datepicker.mountInput(w, {
          label: o.label || 'Выберите дату',
          state: o.state || '',
          populated: !!o.populated,
          placeholder: o.placeholder || 'ДД.ММ.ГГГГ'
        });
        if (o.text) {
          api.input.value = o.text;
          api.input.dispatchEvent(new Event('input'));
        }
        return step;
      }

      function stepCal(o) {
        var step = el('div', 'dpb-step');
        if (o.cap) step.appendChild(el('span', 'dpb-cap', o.cap));
        var card = el('div', 'dpb-cal');
        var host = el('div');
        card.appendChild(host);
        step.appendChild(card);
        /* календарь — ЖИВОЙ: клик по дню/году/месяцу, стрелки и пилюля работают */
        var cal = Datepicker.mount(host, {
          mode: o.mode || 'day',
          months: o.months || 1,
          decade: !!o.decade,
          view: o.view || JUNE,
          today: TODAY,
          start: o.start || SEL,
          end: o.end || (o.mode === 'year' || o.mode === 'month' ? null : SEL)
        });
        if (o.hoverDay) {
          var ts = new Date(o.hoverDay).getTime();
          var cell = host.querySelector('[data-day="' + ts + '"]');
          if (cell) cell.classList.add('dpb-hover-cell');
        }
        return step;
      }

      function row(steps) {
        var r = el('div', 'dpb-row');
        steps.forEach(function (s, i) {
          if (i) r.appendChild(el('span', 'dpb-arrow', '→'));
          r.appendChild(s);
        });
        return r;
      }

      function section(o) {
        var s = el('section', 'dpb-sec');
        s.appendChild(el('h3', 'dpb-sec__title', o.title));
        if (o.body) s.appendChild(el('p', 'dpb-sec__body', o.body));
        (o.blocks || []).forEach(function (b) {
          var blk = el('div', 'dpb-block');
          if (b.title) blk.appendChild(el('h4', 'dpb-block__title', b.title));
          if (b.note) blk.appendChild(el('p', 'dpb-note', b.note));
          (b.rows || []).forEach(function (steps) { blk.appendChild(row(steps)); });
          s.appendChild(blk);
        });
        return s;
      }

      var F = stepField, C = stepCal;

      /* 1. Дефолтный выбор даты */
      root.appendChild(section({
        title: 'Дефолтный выбор даты',
        body: 'Компонент выбора даты позволяет пользователям вводить дату либо с помощью текстового поля, либо выбирая дату из календаря',
        blocks: [{
          title: 'По текстовому полю (input)',
          rows: [[
            F({ cap: 'Default' }),
            F({ cap: 'Hover', state: 'hover' }),
            F({ cap: 'Focus', state: 'focus', placeholder: 'дд.мм.гггг' }),
            F({ cap: 'Focus+Value', state: 'focus-value', text: '10.06.2026' }),
            F({ cap: 'Selected', state: 'selected', text: '10.06.2026' })
          ]]
        }, {
          title: 'По иконке календаря',
          rows: [[
            F({ cap: 'Default' }),
            F({ cap: 'Hover', state: 'hover' }),
            F({ cap: 'Focus', state: 'focus', placeholder: 'дд.мм.гггг' }),
            C({ cap: 'Дата сегодня' }),
            C({ cap: 'Дата сегодня и выбираемая дата (hover)', hoverDay: new Date(2026, 5, 17) }),
            C({ cap: 'Дата сегодня и выбранная дата (selected)' })
          ]]
        }, {
          title: 'Микс',
          note: 'Выпадающий календарь также появляется при клике в текстовом поле',
          rows: [[
            F({ cap: 'Default' }),
            F({ cap: 'Hover', state: 'hover' }),
            F({ cap: 'Focus', state: 'focus', placeholder: 'дд.мм.гггг' }),
            F({ cap: 'Selected', state: 'selected', text: '10.06.2026' })
          ]]
        }]
      }));

      /* 2. Выбор диапазона дат */
      root.appendChild(section({
        title: 'Выбор диапазона дат',
        body: 'Компонент выбора диапазона дат позволяет пользователям вводить начальную и конечную дату соответственно с помощью текстового поля, либо выбирая дату из календаря',
        blocks: [{
          title: 'По текстовому полю (input)',
          rows: [[
            F({ cap: 'Default', label: 'Выберите диапазон дат' }),
            F({ cap: 'Hover', label: 'Выберите диапазон дат', state: 'hover' }),
            F({ cap: 'Focus', label: 'Выберите диапазон дат', state: 'focus', placeholder: 'ДД.ММ.ГГГГ - ДД.ММ.ГГГГ' }),
            F({ cap: 'Focus+Value', label: 'Выберите диапазон дат', state: 'focus-value', text: '10.06.2026' }),
            F({ cap: 'Selected', label: 'Выберите диапазон дат', state: 'selected', text: '10.06.2026 - 21.06.2026' })
          ]]
        }, {
          title: 'По иконке календаря',
          rows: [[
            F({ cap: 'Default', label: 'Выберите диапазон дат' }),
            F({ cap: 'Hover', label: 'Выберите диапазон дат', state: 'hover' }),
            F({ cap: 'Focus', label: 'Выберите диапазон дат', state: 'focus', placeholder: 'ДД.ММ.ГГГГ - ДД.ММ.ГГГГ' }),
            C({ cap: 'Дата сегодня' }),
            C({ cap: 'Дата сегодня и выбираемая дата (hover)', hoverDay: new Date(2026, 5, 17) }),
            C({ cap: 'Дата сегодня и выбранная дата (selected)' })
          ]]
        }]
      }));

      /* 3. Календарь на два месяца (кадр 61306-79280: две колонки 312 + разделитель 1×280) */
      root.appendChild(section({
        title: 'Календарь на два месяца',
        body: 'В режиме выбора периода календарь показывает два месяца подряд: левая колонка — текущий месяц, правая — следующий. Стрелки листают сразу оба месяца.',
        blocks: [{
          rows: [[
            C({ cap: 'Default' }),
            C({ cap: 'Hover', hoverDay: new Date(2026, 5, 26) }),
            C({ cap: 'Focus', months: 2, view: new Date(2026, 6, 1) }),
            C({ cap: 'Focus', months: 2, view: new Date(2026, 6, 1), hoverDay: new Date(2026, 7, 5) })
          ]]
        }]
      }));

      /* 4. Выбор месяца и года в календаре */
      root.appendChild(section({
        title: 'Выбор месяца и года в календаре',
        body: 'Выбора месяца и года позволяет пользователям просматривать и выбирать разные месяцы и годы соответственно',
        blocks: [{
          rows: [[
            C({ cap: 'Focus' }),
            C({ cap: 'Focus', hoverDay: new Date(2026, 5, 3) }),
            C({ cap: 'Focus', mode: 'year', decade: true, hoverDay: null }),
            C({ cap: 'Focus', mode: 'year', decade: true }),
            C({ cap: 'Focus', mode: 'month' })
          ]]
        }, {
          note: 'Выбранный год — показывается блок годов, в котором находится выбор (2020 - 2039); выбранный месяц — сетка месяцев того же года.'
        }]
      }));
      } catch (e) { console.error('behavior tab:', e); }
    })();

    /* Табы — компонент ДС Tabs: переключаем активный таб и панель */
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.ds-tab[data-vtab]'));
    var panels = Array.prototype.slice.call(document.querySelectorAll('[data-vpanel]'));
    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabs.forEach(function (b) {
          var on = b === btn;
          b.classList.toggle('ds-tab--active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        panels.forEach(function (p) {
          p.hidden = p.getAttribute('data-vpanel') !== btn.getAttribute('data-vtab');
        });
      });
    });
  });
</script>
</body>
</html>
